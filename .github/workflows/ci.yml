name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    name: Plugin Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code and Copilot API proxy
        run: npm install -g @anthropic-ai/claude-code @anthropic-ai/copilot-api

      - name: Verify Claude Code installed
        run: claude --version

      - name: Start Copilot API proxy
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot-api &
          sleep 5
          echo "✅ Copilot API proxy started"

      - name: Create test repo with .claude/ and .github/ fixtures
        run: |
          mkdir -p /tmp/test-repo
          cd /tmp/test-repo
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"

          # .claude/ fixtures
          mkdir -p .claude/agents .claude/skills .claude/commands

          cat > .claude/agents/code-reviewer.md << 'EOF'
          # Code Reviewer
          You are a code review agent. Review code for best practices, bugs, and security issues.
          EOF

          cat > .claude/agents/test-writer.md << 'EOF'
          # Test Writer
          You are a test writing agent. Generate comprehensive test suites for code.
          EOF

          cat > .claude/skills/deploy.md << 'EOF'
          # Deploy Skill
          Instructions for deploying applications to production environments.
          EOF

          cat > .claude/commands/lint.md << 'EOF'
          # Lint
          Run linters across the project and fix any issues found.
          EOF

          cat > .claude/instructions.md << 'EOF'
          # Project Instructions
          This is a TypeScript project using Node.js. Follow standard conventions.
          EOF

          # .github/ fixtures
          mkdir -p .github/agents .github/skills

          cat > .github/copilot-instructions.md << 'EOF'
          # Copilot Instructions
          Use TypeScript strict mode. Prefer functional patterns.
          EOF

          cat > .github/agents/security-scanner.md << 'EOF'
          # Security Scanner
          You scan code for security vulnerabilities and suggest fixes.
          EOF

          git add -A
          git commit -m "Initial test fixtures"

      - name: Install plugin and scaffold a dummy plugin
        env:
          ANTHROPIC_BASE_URL: http://localhost:4141
          ANTHROPIC_AUTH_TOKEN: dummy
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          cd /tmp/test-repo

          claude -p "You have the scaffold-plugin skill loaded. \
            Create a plugin called 'test-toolkit' with description 'A test toolkit plugin'. \
            Include ALL agents, ALL skills, ALL commands, and ALL instructions found. \
            Do NOT ask me any questions — just include everything and generate the plugin. \
            The author name is 'CI Test'." \
            --plugin-dir "$GITHUB_WORKSPACE" \
            --allowedTools "Bash,Read,Write,Edit" \
            --output-format json \
            --max-turns 30 \
            | tee /tmp/claude-output.json

          echo ""
          echo "=== Claude Output ==="
          cat /tmp/claude-output.json | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              print('Session:', data.get('session_id', 'N/A'))
              print('Cost:', data.get('cost_usd', 'N/A'))
              result = data.get('result', '')
              print('Result preview:', result[:500] if result else 'No result')
          except:
              print('Raw output (not JSON)')
          "

      - name: Verify generated plugin structure
        run: |
          cd /tmp/test-repo
          echo "=== Looking for generated plugin ==="
          ls -la

          PLUGIN_DIR=""
          if [ -d "test-toolkit" ]; then
            PLUGIN_DIR="test-toolkit"
          fi

          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Plugin directory 'test-toolkit' not found"
            echo "Directory contents:"
            find . -maxdepth 2 -not -path './.git/*' | sort
            exit 1
          fi

          echo "✅ Found plugin at: $PLUGIN_DIR"
          echo ""
          echo "=== Plugin contents ==="
          find "$PLUGIN_DIR" -type f | sort

          # Check for manifest in either new or legacy format
          MANIFEST="$PLUGIN_DIR/.claude-plugin/plugin.json"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST="$PLUGIN_DIR/plugin.json"
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ No plugin.json found in plugin"
            exit 1
          fi

          echo "✅ Plugin manifest found: $MANIFEST"
          python3 -m json.tool "$MANIFEST" > /dev/null
          echo "✅ Plugin manifest is valid JSON"

          python3 -c "
          import json
          with open('$MANIFEST') as f:
              p = json.load(f)
          assert p.get('name'), 'Missing name'
          assert p.get('version'), 'Missing version'
          assert p.get('description'), 'Missing description'
          print(f'✅ Plugin: {p[\"name\"]} v{p[\"version\"]}')
          print(f'   {p[\"description\"]}')
          "

          MD_COUNT=$(find "$PLUGIN_DIR" -name "*.md" | wc -l)
          echo "✅ Found $MD_COUNT markdown file(s) in plugin"
          if [ "$MD_COUNT" -lt 1 ]; then
            echo "❌ Expected at least 1 markdown file in the plugin"
            exit 1
          fi

      - name: Test loading the generated plugin
        env:
          ANTHROPIC_BASE_URL: http://localhost:4141
          ANTHROPIC_AUTH_TOKEN: dummy
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          cd /tmp/test-repo

          PLUGIN_DIR="test-toolkit"
          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "⚠️ Skipping load test — plugin dir not found"
            exit 0
          fi

          claude -p "List what plugins and skills are available to you." \
            --plugin-dir "./$PLUGIN_DIR" \
            --output-format json \
            --max-turns 3 \
            | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              print('✅ Claude loaded the generated plugin successfully')
              result = data.get('result', '')
              print('Response:', result[:300] if result else 'No result')
          except:
              print('✅ Claude responded (non-JSON output)')
              sys.exit(0)
          "
