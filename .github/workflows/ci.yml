name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    name: Plugin Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Create test repo with fixtures
        run: |
          mkdir -p /tmp/test-repo
          cd /tmp/test-repo
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"

          # .claude/ fixtures
          mkdir -p .claude/agents .claude/skills .claude/commands

          cat > .claude/agents/code-reviewer.md << 'EOF'
          # Code Reviewer
          You are a code review agent. Review code for best practices, bugs, and security issues.
          EOF

          cat > .claude/agents/test-writer.md << 'EOF'
          # Test Writer
          You are a test writing agent. Generate comprehensive test suites for code.
          EOF

          cat > .claude/skills/deploy.md << 'EOF'
          # Deploy Skill
          Instructions for deploying applications to production environments.
          EOF

          cat > .claude/commands/lint.md << 'EOF'
          # Lint
          Run linters across the project and fix any issues found.
          EOF

          cat > .claude/instructions.md << 'EOF'
          # Project Instructions
          This is a TypeScript project using Node.js. Follow standard conventions.
          EOF

          # .github/ fixtures
          mkdir -p .github/agents

          cat > .github/copilot-instructions.md << 'EOF'
          # Copilot Instructions
          Use TypeScript strict mode. Prefer functional patterns.
          EOF

          cat > .github/agents/security-scanner.md << 'EOF'
          # Security Scanner
          You scan code for security vulnerabilities and suggest fixes.
          EOF

          git add -A
          git commit -m "Initial test fixtures"

      - name: Use Copilot CLI to scaffold a plugin
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          cd /tmp/test-repo

          # Load plugin-creator and invoke plugin-create skill to scaffold a dummy plugin
          copilot -p "Use the create-plugin skill. \
            Create a plugin called 'test-toolkit' with description 'A test toolkit plugin'. \
            Include ALL agents, ALL skills, ALL commands, ALL instructions, ALL hooks, and ALL MCP configs found. \
            Do NOT ask me any questions — include everything and generate the plugin. \
            The author name is 'CI Test'." \
            --plugin-dir "$GITHUB_WORKSPACE" \
            --allowedTools "Bash,Read,Write,Edit" \
            --max-turns 30

      - name: Verify generated plugin
        run: |
          cd /tmp/test-repo

          # Plugin directory must exist
          if [ ! -d "test-toolkit" ]; then
            echo "❌ Plugin directory 'test-toolkit' not found"
            find . -maxdepth 2 -not -path './.git/*' | sort
            exit 1
          fi
          echo "✅ Plugin directory exists"

          # Manifest must be valid JSON with required fields
          MANIFEST="test-toolkit/.claude-plugin/plugin.json"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST="test-toolkit/plugin.json"
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ No plugin.json found"
            find test-toolkit -type f | sort
            exit 1
          fi

          python3 -m json.tool "$MANIFEST" > /dev/null
          python3 -c "
          import json
          with open('$MANIFEST') as f:
              p = json.load(f)
          assert p.get('name'), 'Missing name'
          assert p.get('version'), 'Missing version'
          assert p.get('description'), 'Missing description'
          print(f'✅ Manifest: {p[\"name\"]} v{p[\"version\"]}')
          "

          # Check agents exist
          AGENT_COUNT=$(find test-toolkit/agents -name "*.md" 2>/dev/null | wc -l)
          echo "✅ Agents: $AGENT_COUNT file(s)"
          if [ "$AGENT_COUNT" -lt 1 ]; then
            echo "❌ Expected at least 1 agent"
            exit 1
          fi

          # Check skills exist (SKILL.md format)
          SKILL_COUNT=$(find test-toolkit/skills -name "SKILL.md" 2>/dev/null | wc -l)
          if [ "$SKILL_COUNT" -lt 1 ]; then
            # Also check for flat .md skills
            SKILL_COUNT=$(find test-toolkit/skills -name "*.md" 2>/dev/null | wc -l)
          fi
          echo "✅ Skills: $SKILL_COUNT file(s)"
          if [ "$SKILL_COUNT" -lt 1 ]; then
            echo "❌ Expected at least 1 skill"
            exit 1
          fi

          # Check commands exist
          CMD_COUNT=$(find test-toolkit/commands -name "*.md" 2>/dev/null | wc -l)
          echo "✅ Commands: $CMD_COUNT file(s)"
          if [ "$CMD_COUNT" -lt 1 ]; then
            echo "❌ Expected at least 1 command"
            exit 1
          fi

          echo ""
          echo "=== Generated plugin contents ==="
          find test-toolkit -type f | sort

      - name: Load generated plugin in Copilot CLI
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          cd /tmp/test-repo

          if [ ! -d "test-toolkit" ]; then
            echo "⚠️ Skipping — plugin not generated"
            exit 0
          fi

          # Verify Copilot CLI can load the generated plugin
          copilot -p "What plugins and skills do you have available?" \
            --plugin-dir "./test-toolkit" \
            --max-turns 3

          echo ""
          echo "✅ Copilot CLI loaded the generated plugin successfully"
